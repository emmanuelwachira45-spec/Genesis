<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Pesa Payment</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
            background:
                radial-gradient(circle at top,#0b5d1e 0%,#0b5d1e 12%,#111111 45%,#000000 100%);
        }

        .card{
            width:100%;
            max-width:420px;
            background:#ffffff;
            border-radius:20px;
            padding:35px;
            box-shadow:
                0 20px 45px rgba(0,0,0,.45),
                0 0 30px rgba(0,179,0,.18);
        }

        .logo{
            width:80px;
            height:80px;
            background:#00b300;
            color:#fff;
            margin:auto;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:32px;
            font-weight:bold;
            margin-bottom:20px;
            box-shadow:0 10px 25px rgba(0,179,0,.35);
        }

        h2{
            text-align:center;
            color:#222;
            margin-bottom:8px;
        }

        p{
            text-align:center;
            color:#666;
            font-size:14px;
            margin-bottom:30px;
            line-height:1.6;
        }

        .form-group{
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-bottom:8px;
            color:#444;
            font-weight:500;
        }

        input{
            width:100%;
            padding:14px 16px;
            border:1px solid #ddd;
            border-radius:12px;
            font-size:15px;
            outline:none;
            transition:.3s;
        }

        input:focus{
            border-color:#00b300;
            box-shadow:0 0 0 4px rgba(0,179,0,.18);
        }

        input[readonly]{
            background:#f5f5f5;
            color:#008000;
            font-weight:600;
        }

        .pay-btn{
            width:100%;
            padding:15px;
            border:none;
            border-radius:12px;
            background:#00b300;
            color:#fff;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:.3s;
        }

        .pay-btn:hover{
            background:#008a00;
            transform:translateY(-2px);
            box-shadow:0 10px 25px rgba(0,179,0,.35);
        }

        .pay-btn:active{
            transform:scale(.98);
        }

        .secure{
            text-align:center;
            margin-top:22px;
            font-size:13px;
            color:#777;
        }

        .secure span{
            color:#00b300;
            font-weight:600;
        }

        @media(max-width:480px){

            .card{
                padding:25px;
            }

            h2{
                font-size:24px;
            }

        }

    </style>

</head>
<body>

<div class="card">

    <div class="logo">
        M
    </div>

    <h2>M-Pesa Express</h2>

    <p>Complete your payment securely using Safaricom M-Pesa STK Push.</p>

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">
            <label>Phone Number</label>

            <input
                type="text"
                name="phone"
                placeholder="254712345678"
                required>
        </div>

        <div class="form-group">
            <label>Amount (KES)</label>

            <input
                type="number"
                name="amount"
                value="100"
                readonly>
        </div>

        <button type="submit" class="pay-btn">
            💳 Pay Now
        </button>

    </form>

    <div class="secure">
        🔒 <span>Secure Payment</span> powered by M-Pesa
    </div>

</div>

</body>
</html>
